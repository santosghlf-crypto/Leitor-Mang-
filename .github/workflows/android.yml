name: Gerar APK
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Android SDK
        shell: bash
        run: |
          sdk="${ANDROID_HOME:-$HOME/android-sdk}"
          mkdir -p "$sdk/cmdline-tools"
          manager="$(find "$sdk/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          if [ -z "$manager" ]; then
            curl --fail --location --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o "$RUNNER_TEMP/android-tools.zip"
            unzip -q "$RUNNER_TEMP/android-tools.zip" -d "$RUNNER_TEMP/android-tools"
            mv "$RUNNER_TEMP/android-tools/cmdline-tools" "$sdk/cmdline-tools/koma"
            manager="$sdk/cmdline-tools/koma/bin/sdkmanager"
          fi
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          set +o pipefail
          yes | "$manager" --sdk_root="$sdk" --licenses
          set -o pipefail
          # SDK 37 can be on a preview channel; never substitute SDK 36.
          "$manager" --sdk_root="$sdk" --list --channel=3 > "$RUNNER_TEMP/sdk-list.txt"
          cat "$RUNNER_TEMP/sdk-list.txt"
          platform="$(awk -F'|' '{gsub(/^[ \t]+|[ \t]+$/, "", $1); if($1=="platforms;android-37"){print $1;exit}}' "$RUNNER_TEMP/sdk-list.txt")"
          if [ -z "$platform" ]; then
            platform="$(awk -F'|' '{gsub(/^[ \t]+|[ \t]+$/, "", $1); if($1=="platforms;android-CinnamonBun"){print $1;exit}}' "$RUNNER_TEMP/sdk-list.txt")"
            if [ -n "$platform" ]; then echo "KOMA_COMPILE_PREVIEW=CinnamonBun" >> "$GITHUB_ENV"; fi
          fi
          if [ -z "$platform" ]; then echo "::error::SDK 37/CinnamonBun ausente do catálogo oficial"; exit 1; fi
          buildtools="$(awk -F'|' '{gsub(/^[ \t]+|[ \t]+$/, "", $1); if($1 ~ /^build-tools;37\./)print $1}' "$RUNNER_TEMP/sdk-list.txt" | sort -Vu | tail -1)"
          if [ -z "$buildtools" ]; then buildtools="build-tools;36.0.0"; fi
          "$manager" --sdk_root="$sdk" --install --channel=3 "$platform" "$buildtools" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Testar políticas de desempenho
        run: |
          node --test tools/tests/reader-perf.test.cjs
          mkdir -p "$RUNNER_TEMP/koma-tests"
          javac -d "$RUNNER_TEMP/koma-tests" app/src/main/java/br/app/koma/PerfPolicy.java tools/tests/PerfPolicyTest.java
          java -cp "$RUNNER_TEMP/koma-tests" br.app.koma.PerfPolicyTest
      - name: Testar segurança
        run: |
          python3 -m unittest discover -s tools/tests -p 'test_blocker.py' -v
          javac -d "$RUNNER_TEMP/koma-tests" app/src/main/java/br/app/koma/SecurityPolicy.java tools/tests/SecurityPolicyTest.java
          java -cp "$RUNNER_TEMP/koma-tests" br.app.koma.SecurityPolicyTest
      - run: gradle :app:assembleDebug --stacktrace
      - name: Verificar conteúdo do APK
        run: |
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile("app/build/outputs/apk/debug/app-debug.apk") as z:
              files=set(z.namelist())
              for path in ["AndroidManifest.xml","classes.dex","assets/ublock/manifest.json","assets/paginas/manifest.json","assets/paginas/reader.js"]:
                  assert path in files, "Arquivo ausente: "+path
              assert any(p.startswith("lib/arm64-v8a/") for p in files), "Bibliotecas ARM64 ausentes"
              import json
              ubo=json.loads(z.read("assets/ublock/manifest.json"))
              assert ubo["version"]=="1.77.0", "Versão do uBlock incorreta"
              assert (ubo.get("browser_specific_settings") or ubo["applications"])["gecko"]["id"]=="uBlock0@raymondhill.net"
          print("APK contém GeckoView ARM64 e as extensões.")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Koma-Android-arm64
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
