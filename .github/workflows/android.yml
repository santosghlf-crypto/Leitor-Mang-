name: Gerar APK
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Android SDK
        shell: bash
        run: |
          sdk="${ANDROID_HOME:-$HOME/android-sdk}"
          mkdir -p "$sdk/cmdline-tools"
          manager="$(find "$sdk/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          if [ -z "$manager" ]; then
            curl --fail --location --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o "$RUNNER_TEMP/android-tools.zip"
            unzip -q "$RUNNER_TEMP/android-tools.zip" -d "$RUNNER_TEMP/android-tools"
            mv "$RUNNER_TEMP/android-tools/cmdline-tools" "$sdk/cmdline-tools/koma"
            manager="$sdk/cmdline-tools/koma/bin/sdkmanager"
          fi
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          set +o pipefail
          yes | "$manager" --sdk_root="$sdk" --licenses
          set -o pipefail
          "$manager" --sdk_root="$sdk" --install "platforms;android-37" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Koma-Android-arm64
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
