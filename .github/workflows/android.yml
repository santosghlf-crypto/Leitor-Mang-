name: Gerar APK
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Android SDK
        shell: bash
        run: |
          sdk="${ANDROID_HOME:-$HOME/android-sdk}"
          mkdir -p "$sdk/cmdline-tools"
          manager="$(find "$sdk/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          if [ -z "$manager" ]; then
            curl --fail --location --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o "$RUNNER_TEMP/android-tools.zip"
            unzip -q "$RUNNER_TEMP/android-tools.zip" -d "$RUNNER_TEMP/android-tools"
            mv "$RUNNER_TEMP/android-tools/cmdline-tools" "$sdk/cmdline-tools/koma"
            manager="$sdk/cmdline-tools/koma/bin/sdkmanager"
          fi
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          set +o pipefail
          yes | "$manager" --sdk_root="$sdk" --licenses
          set -o pipefail
          "$manager" --sdk_root="$sdk" --install "platforms;android-37.2" "build-tools;37.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Testar políticas de desempenho
        run: |
          node --test tools/tests/reader-perf.test.cjs
          mkdir -p "$RUNNER_TEMP/koma-tests"
          javac -d "$RUNNER_TEMP/koma-tests" app/src/main/java/br/app/koma/PerfPolicy.java tools/tests/PerfPolicyTest.java
          java -cp "$RUNNER_TEMP/koma-tests" br.app.koma.PerfPolicyTest
      - name: Testar segurança
        run: |
          python3 -m unittest discover -s tools/tests -p 'test_blocker.py' -v
          javac -d "$RUNNER_TEMP/koma-tests" app/src/main/java/br/app/koma/SecurityPolicy.java tools/tests/SecurityPolicyTest.java
          java -cp "$RUNNER_TEMP/koma-tests" br.app.koma.SecurityPolicyTest
      - name: Testar experiência de leitura
        run: |
          node --test tools/tests/reader-experience.test.cjs
          javac -d "$RUNNER_TEMP/koma-tests" app/src/main/java/br/app/koma/{SecurityPolicy,ReadingPolicy}.java tools/tests/ReadingPolicyTest.java
          java -cp "$RUNNER_TEMP/koma-tests" br.app.koma.ReadingPolicyTest
      - name: Testar perfis de extensões
        run: node --test tools/tests/adapter.test.cjs
      - name: Testar limites offline
        run: |
          javac -d "$RUNNER_TEMP/koma-tests" app/src/main/java/br/app/koma/OfflinePolicy.java tools/tests/OfflinePolicyTest.java
          java -cp "$RUNNER_TEMP/koma-tests" br.app.koma.OfflinePolicyTest
      - name: Testar auditoria de desempenho
        run: node --test tools/tests/audit.test.cjs
      - name: Configurar assinatura persistente opcional
        env:
          KEYSTORE_B64: ${{ secrets.KOMA_KEYSTORE_B64 }}
          KOMA_STORE_PASSWORD: ${{ secrets.KOMA_STORE_PASSWORD }}
          KOMA_KEY_ALIAS: ${{ secrets.KOMA_KEY_ALIAS }}
          KOMA_KEY_PASSWORD: ${{ secrets.KOMA_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            if [ -z "$KOMA_STORE_PASSWORD" ] || [ -z "$KOMA_KEY_ALIAS" ] || [ -z "$KOMA_KEY_PASSWORD" ]; then
              echo "::error::Configuração de assinatura incompleta"; exit 1
            fi
            umask 077
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/koma-signing.p12"
            echo "KOMA_KEYSTORE_FILE=$RUNNER_TEMP/koma-signing.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::APK de teste com certificado temporário. Atualização de versões anteriores pode não ser possível."
          fi
      - name: Testar biblioteca e gerar APK
        env:
          KOMA_STORE_PASSWORD: ${{ secrets.KOMA_STORE_PASSWORD }}
          KOMA_KEY_ALIAS: ${{ secrets.KOMA_KEY_ALIAS }}
          KOMA_KEY_PASSWORD: ${{ secrets.KOMA_KEY_PASSWORD }}
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Remover chave temporária
        if: always()
        run: rm -f "$RUNNER_TEMP/koma-signing.p12"
      - name: Verificar conteúdo do APK
        run: |
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile("app/build/outputs/apk/debug/app-debug.apk") as z:
              files=set(z.namelist())
              for path in ["AndroidManifest.xml","classes.dex","assets/ublock/manifest.json","assets/paginas/manifest.json","assets/paginas/reader.js","assets/paginas/adapter.js"]:
                  assert path in files, "Arquivo ausente: "+path
              assert any(p.startswith("lib/arm64-v8a/") for p in files), "Bibliotecas ARM64 ausentes"
              import json
              ubo=json.loads(z.read("assets/ublock/manifest.json"))
              assert ubo["version"]=="1.77.0", "Versão do uBlock incorreta"
              assert (ubo.get("browser_specific_settings") or ubo["applications"])["gecko"]["id"]=="uBlock0@raymondhill.net"
          print("APK contém GeckoView ARM64 e as extensões.")
          PY
      - name: Verificar assinatura e manifesto efetivo
        run: |
          apk=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs "$apk"
          "$ANDROID_HOME/build-tools/37.0.0/aapt2" dump badging "$apk"
          "$ANDROID_HOME/build-tools/37.0.0/aapt2" dump permissions "$apk"
          python3 tools/audit_apk.py "$apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Koma-Android-arm64
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
