plugins {
    id 'com.android.application' version '9.2.1'
}
android {
    namespace 'br.app.koma'
    compileSdk {
        version = release(37) { minorApiLevel = 2 }
    }
    buildToolsVersion '37.0.0'
    defaultConfig {
        applicationId 'br.app.koma'
        minSdk 26
        targetSdk 35
        versionCode 10
        versionName '7.1'
        ndk { abiFilters 'arm64-v8a' }
    }
    // CI test APK uses debug signing but must never enable app debugging.
    buildTypes {
        debug {
            debuggable false
        }
    }
    // Optional persistent owner-managed key. No private signing key in this repository.
    if (System.getenv('KOMA_KEYSTORE_FILE')) {
        signingConfigs {
            persistent {
                storeFile file(System.getenv('KOMA_KEYSTORE_FILE'))
                storePassword System.getenv('KOMA_STORE_PASSWORD')
                keyAlias System.getenv('KOMA_KEY_ALIAS')
                keyPassword System.getenv('KOMA_KEY_PASSWORD')
            }
        }
        buildTypes.debug.signingConfig = signingConfigs.persistent
    }
    sourceSets.main.assets.srcDir layout.buildDirectory.dir('generated/extensionAssets').get().asFile
    androidResources { ignoreAssetsPattern '!.svn:!.git:!CVS:!*~' }
}
dependencies {
    implementation 'org.mozilla.geckoview:geckoview:161.0.20261118180411'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
def blocker = tasks.register('prepareBlocker', Exec) {
    def output = layout.buildDirectory.dir('generated/extensionAssets/ublock')
    inputs.file rootProject.file('tools/blocker.py')
    outputs.dir output
    commandLine 'python3', rootProject.file('tools/blocker.py'), output.get().asFile
}
tasks.named('preBuild').configure { dependsOn blocker }
